function getH(id){return H.find(h=>h.id===id);}
function analyzeSymptoms(txt){
  const l=txt.toLowerCase(),scores={};
  for(const[cat,d]of Object.entries(SYMP)){for(const kw of d.kw){if(l.includes(kw)){scores[cat]=(scores[cat]||0)+1;break;}}}
  const sorted=Object.entries(scores).sort((a,b)=>b[1]-a[1]);
  if(!sorted.length)return null;
  const tops=sorted.slice(0,3).map(([c])=>c),uo=["emergency","urgent","routine"];
  let urg="routine";const ids=[];
  tops.forEach(c=>{const d=SYMP[c];if(uo.indexOf(d.urg)<uo.indexOf(urg))urg=d.urg;d.hosp.forEach(id=>{if(!ids.includes(id))ids.push(id);});});
  return{cats:tops,specialties:tops.map(c=>SYMP[c].sp),urgency:urg,hospitals:ids.slice(0,4).map(getH).filter(Boolean)};
}

let DIR_UPDATED="";
function mergeExtras(extra){
  if(!extra)return;
  const ALIAS={"plastic surgery":"plastic",tb:"pulmonology",tuberculosis:"pulmonology",renal:"nephrology",dialysis:"nephrology",kidney:"nephrology",ivf:"gynecology",fertility:"gynecology",neonatology:"pediatrics","mental health":"psychiatry",addiction:"psychiatry"};
  (extra.hospitals||[]).forEach(x=>{
    if(!x||H.some(h=>h.id===x.id))return;
    x.specs=x.specs||[];x.tags=x.tags||[];H.push(x);
    x.tags.forEach(t=>{const k=SYMP[t]?t:ALIAS[t];if(k&&SYMP[k]&&!SYMP[k].hosp.includes(x.id))SYMP[k].hosp.push(x.id);});
  });
  (extra.doctorAdditions||[]).forEach(d=>{
    const h=H.find(h=>h.id===d.hospitalId);if(!h||!d.name)return;
    const bare=d.name.split("(")[0].trim().toLowerCase();
    if(h.specs.some(s=>s.docs.some(x=>x.toLowerCase().includes(bare))))return;
    const key=(d.specialty||"").toLowerCase();
    let sp=key?h.specs.find(s=>s.n.toLowerCase().includes(key)||key.includes(s.n.toLowerCase())):null;
    if(!sp){sp={n:d.specialty||"Other specialists",icon:"◈",subs:[],docs:[]};h.specs.push(sp);}
    sp.docs.push(d.name+" · newly listed");
  });
  DIR_UPDATED=extra.lastUpdated||"";
}

/* ─── AI TRIAGE ─────────────────────────────────────────────────────────
   Calls your own free backend (Netlify Function or Cloudflare Worker).
   The Gemini / Cloudflare key lives on the server — never in this file.
   Cloudflare users: change TRIAGE_ENDPOINT to your Worker URL, e.g.
   "https://mediguide-triage.YOUR-NAME.workers.dev"                       */
const TRIAGE_ENDPOINT="/.netlify/functions/triage";
async function callTriage(sym,onChunk){
  const resp=await fetch(TRIAGE_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({symptoms:sym})});
  const data=await resp.json().catch(()=>({}));
  if(!resp.ok||!data.text)throw new Error(data.error||("Error "+resp.status));
  const words=data.text.split(" ");let shown="";
  for(let i=0;i<words.length;i++){shown+=(i?" ":"")+words[i];onChunk(shown);await new Promise(r=>setTimeout(r,16));}
}

function SymptomChecker(){
  const[input,setInput]=useState("");
  const[step,setStep]=useState(0);
  const[loading,setLoading]=useState(false);
  const[aiText,setAiText]=useState("");
  const[result,setResult]=useState(null);
  const[err,setErr]=useState("");
  const aiRef=useRef("");

  const submit=async()=>{
    if(!input.trim())return;
    setLoading(true);setAiText("");setErr("");aiRef.current="";
    setResult(analyzeSymptoms(input));setStep(1);
    try{await callTriage(input,t=>{aiRef.current=t;setAiText(t);});}
    catch(e){
      setErr("AI guidance is temporarily unavailable (free-tier limit reached or network issue). The keyword-matched recommendations above are still valid — please call the hospital directly.");
    }
    setLoading(false);
  };

  const reset=()=>{setStep(0);setInput("");setAiText("");setResult(null);setErr("");};
  const urgColor=r=>r==="emergency"?"#ff3333":r==="urgent"?"#ff9900":"#22c55e";
  const urgLabel=r=>r==="emergency"?"⚠ EMERGENCY — Go to Emergency Room Now":r==="urgent"?"◉ URGENT — Seek Care Within 24-48 Hours":"◎ ROUTINE — Schedule an Appointment";

  return E("div",{style:{background:"linear-gradient(135deg,#0a1a3a,#0f2050)",border:"2px solid #c8a951",borderRadius:16,padding:"24px 28px",marginBottom:28}},
    E("div",{style:{display:"flex",alignItems:"center",gap:14,marginBottom:8}},
      E("div",{style:{width:44,height:44,borderRadius:"50%",background:"#c8a951",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0}},"⚕"),
      E("div",null,
        E("div",{style:{fontSize:19,fontWeight:800,color:"#e8f0ff",fontFamily:"'Playfair Display',serif"}},"AI Medical Triage Assistant"),
        E("div",{style:{fontSize:11,color:"#8ea8d0"}},"Powered by Google Gemini AI · Describe symptoms → Find the right specialist in Addis Ababa")
      )
    ),
    E("div",{style:{height:1,background:"#1e3a6e",margin:"14px 0"}}),
    step===0&&E("div",null,
      E("div",{style:{fontSize:12,color:"#8ea8d0",fontWeight:600,marginBottom:5}},"Describe your symptoms in detail:"),
      E("div",{style:{fontSize:10,color:"#4a6a9a",marginBottom:9}},'Example: "I have chest pain radiating to my left arm with shortness of breath for 2 hours"'),
      E("textarea",{className:"sym-area",value:input,onChange:e=>setInput(e.target.value),onKeyDown:e=>{if(e.key==="Enter"&&e.ctrlKey)submit();},placeholder:"Describe your symptoms, duration, severity, and any relevant medical history..."}),
      E("div",{style:{display:"flex",gap:7,flexWrap:"wrap",margin:"9px 0 13px"}},
        ["Chest pain and palpitations","Severe headache and vomiting","Knee pain after injury","Abnormal vaginal bleeding","Skin rash and itching","Child with high fever","Urinary leaking after delivery","Persistent cough with blood","Feeling sad and hopeless","Burns on arm"].map((ex,i)=>
          E("button",{key:i,className:"ex-btn",onClick:()=>setInput(ex)},ex)
        )
      ),
      E("button",{className:`submit-btn ${input.trim()?"on":"off"}`,onClick:submit,disabled:!input.trim()},loading?"Analyzing...":"Find My Specialist & Hospital →")
    ),
    step===1&&E("div",{style:{animation:"fadeIn .35s ease"}},
      E("div",{style:{background:"#070f1e",borderRadius:9,padding:"9px 13px",marginBottom:14,border:"1px solid #1e3a6e",fontSize:12}},
        E("span",{style:{color:"#4a6a9a"}},"Your symptoms: "),E("span",{style:{color:"#8ea8d0"}},input)
      ),
      result&&E("div",null,
        E("div",{className:`urg-${result.urgency}`},urgLabel(result.urgency)),
        E("div",{style:{display:"flex",gap:7,flexWrap:"wrap",marginBottom:14}},
          result.specialties.map((sp,i)=>E("span",{key:i,style:{background:"#0d2040",border:"1px solid #3b82f6",color:"#3b82f6",padding:"4px 12px",borderRadius:18,fontSize:11,fontWeight:600}},"⚕ ",sp))
        ),
        E("div",{style:{marginBottom:14}},
          E("div",{style:{fontSize:12,fontWeight:700,color:"#c8a951",marginBottom:9}},"Recommended Hospitals & Specialists"),
          result.hospitals.map((h,i)=>E("div",{key:i,className:`rec-card${i===0?" top":""}`},
            E("div",{className:"num-circle",style:{background:i===0?"#c8a951":"#1e3a6e",color:i===0?"#0a0800":"#8ea8d0"}},"#"+(i+1)),
            E("div",{style:{flex:1,minWidth:0}},
              E("div",{style:{fontSize:12,fontWeight:700,color:i===0?"#c8a951":"#e8f0ff",marginBottom:2}},h.name),
              E("div",{style:{fontSize:11,color:"#8ea8d0"}},"📍 ",h.addr),
              E("div",{style:{fontSize:11,color:"#8ea8d0"}},"📞 ",h.phone," · ",h.appt),
              E("div",{style:{fontSize:11,color:"#8ea8d0",marginTop:3}},h.specs.slice(0,2).flatMap(s=>s.docs).slice(0,2).map((d,k)=>E("span",{key:k,style:{marginRight:10}},"◈ ",d)))
            )
          ))
        )
      ),
      E("div",{style:{background:"#070f1e",borderRadius:9,padding:"14px 18px",border:"1px solid #1e3a6e",marginBottom:14}},
        E("div",{style:{fontSize:12,fontWeight:700,color:"#c8a951",marginBottom:9}},"⚕ AI Clinical Guidance",loading&&E("span",{style:{fontSize:10,color:"#8ea8d0",fontWeight:400,marginLeft:8}},"Generating...")),
        aiText?E("div",{style:{fontSize:12,color:"#8ea8d0",lineHeight:1.85,whiteSpace:"pre-wrap"}},aiText):
          loading?E("div",{style:{display:"flex",gap:5,alignItems:"center",color:"#4a6a9a",fontSize:12}},
            E("span",{className:"dot1"},"●"),E("span",{className:"dot2"},"●"),E("span",{className:"dot3"},"●"),E("span",{style:{marginLeft:7}},"Generating personalized clinical guidance...")
          ):null,
        err&&E("div",{style:{color:"#ff9900",fontSize:11,marginTop:8}},err)
      ),
      E("div",{style:{background:"#1a0808",border:"1px solid #4a1010",borderRadius:9,padding:"10px 14px",fontSize:10,color:"#ff8080",marginBottom:12}},
        "⚠️ General information only. Not a substitute for professional medical advice. Always consult a licensed physician."
      ),
      E("button",{className:"reset-btn",onClick:reset},"← Start Over")
    )
  );
}

              E("div",null,E("div",{style:{fontSize:11,fontWeight:700,color:"#e8f0ff",marginBottom:1}},h.name),E("div",{style:{fontSize:10,color:"#8ea8d0"}},"📍 ",h.addr),h.coords?E("div",{style:{fontSize:9,color:"#4a6a9a"}},"🌐 ",h.coords):null,h.phone?E("div",{style:{fontSize:10,color:"#8ea8d0"}},"📞 ",h.phone):null)
            ))
          )
        )
      )
    ),
    E("div",{style:{background:"#050e20",borderTop:"1px solid #1e3a6e",padding:"22px"}},
      E("div",{style:{maxWidth:1100,margin:"0 auto",textAlign:"center"}},
        E("div",{style:{fontSize:16,fontWeight:900,fontFamily:"'Playfair Display',serif",color:"#c8a951",marginBottom:7}},"MediGuide Ethiopia"),
        E("p",{style:{fontSize:11,color:"#8ea8d0",maxWidth:580,margin:"0 auto 12px",lineHeight:1.75}},"Comprehensive medical directory for Addis Ababa, Ethiopia. For guidance only — always verify with hospitals directly. Physician rosters change; call ahead to confirm."),
        E("div",{style:{display:"flex",gap:7,flexWrap:"wrap",justifyContent:"center",marginBottom:10}},
          ["🟢 Public Hospitals","🔵 Private Hospitals","🟡 NGO/Charitable","⚕ AI Symptom Triage"].map((item,i)=>E("span",{key:i,style:{background:"#0f2040",border:"1px solid #1e3a6e",color:"#8ea8d0",padding:"3px 11px",borderRadius:18,fontSize:10}},item))
        ),
        E("button",{onClick:()=>setTab("disclaimer"),style:{background:"transparent",border:"1px solid #1e3a6e",color:"#8ea8d0",padding:"5px 14px",borderRadius:7,fontSize:11,cursor:"pointer",marginBottom:9}},"📋 Read Legal Disclaimer"),
        E("div",{style:{fontSize:10,color:"#4a6a9a"}},"© 2026 MediGuide Ethiopia · Addis Ababa, Ethiopia · Emergency: Dial 911"+(DIR_UPDATED?" · Directory last updated "+DIR_UPDATED:""))
      )
    )
  );
}
fetch("/data/hospitals-extra.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null)
  .then(x=>{try{mergeExtras(x);}catch(e){console.error("extras skipped",e);}ReactDOM.render(E(App),document.getElementById("root"));});
</script>
</body>
